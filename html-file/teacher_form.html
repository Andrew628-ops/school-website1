{{template "head" .}}<main id="main" class="container editor-page">
<a href="/admin?tab=faculty" class="back-link">← Faculty directory</a>
<p class="eyebrow">University workspace</p>
<h1>{{.Title}}</h1>{{template "notices" .}}<form method="post" action="{{if .Editing}}/admin/edit-teacher{{else}}/admin/add-teacher{{end}}" class="form-card">
<input type="hidden" name="csrf" value="{{.CSRF}}">{{if .Editing}}<input type="hidden" name="id" value="{{.Teacher.ID}}">{{end}}<div class="field">
<label for="name">Full name</label>
<input id="name" name="name" value="{{index .Form "name"}}" maxlength="100" required placeholder="Dr. Amina Bello">
</div>
<div class="form-grid">
<div class="field">
<label for="subject">Teaching subject</label>
<input id="subject" name="subject" value="{{index .Form "subject"}}" maxlength="150" required>
</div>
<div class="field">
<label for="department">Academic school</label>
<input list="school-list" id="department" name="department" value="{{index .Form "department"}}" maxlength="150" required>
<datalist id="school-list">{{range .Schools}}<option value="{{.}}">{{end}}</datalist>
</div>
</div>
<div class="field">
<label for="image">Photo path or HTTPS URL <span class="optional">Optional</span>
</label>
<input id="image" name="image" value="{{index .Form "image"}}" maxlength="150" placeholder="/static/image1.jpeg">
<p class="field-hint">Leave blank to use initials. Existing portraits are available under /static/.</p>
</div>
<div class="button-row">
<button type="submit" class="button">Save faculty profile <svg class="icon" aria-hidden="true">
<use href="/static/icons.svg#check"/>
</svg>
</button>
<a href="/admin?tab=faculty" class="text-link">Cancel</a>
</div>
</form>
</main>{{template "footer" .}}
